# 只在一个容器里跑：静态资源 + /api、/files、/ai 反向代理
# 与本地 vite dev server 的 proxy 保持一致，前端代码不需要区分环境。

upstream clf_backend {
    server backend:8081;
}

upstream clf_ai {
    server ai:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 单页应用：刷新 /claims、/notifications 这些前端路由要回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://clf_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /files/ {
        proxy_pass http://clf_backend;
        proxy_set_header Host $host;
        expires 7d;
    }

    # /ai/health -> ai-service 的 /health
    location /ai/ {
        proxy_pass http://clf_ai/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}