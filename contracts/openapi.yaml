openapi: 3.1.0
info:
  title: Campus Lost & Found API
  version: 0.2.0
  description: |
    当前包含健康检查、物品分类、公开帖子列表与详情，以及本地演示验证码注册/登录、JWT 与个人资料。
    所有业务响应统一返回 code、message、data、traceId，并通过 X-Request-Id 传递请求追踪编号。
    后续接口继续按“先契约、后实现、再联调”的顺序追加。
servers:
  - url: http://localhost:8081
    description: 本地开发
security: []

paths:
  /api/v1/auth/sms-code:
    post:
      operationId: sendLoginCode
      summary: 发送登录验证码
      description: 本地开发环境固定返回 123456；验证码 5 分钟有效，同一账号 60 秒内不可重复发送。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendCodeRequest"
      responses:
        "200":
          description: 验证码已生成
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSendCode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      operationId: login
      summary: 验证码登录
      description: 仅允许已注册账号登录；刷新令牌写入 HttpOnly Cookie，访问令牌在响应中返回。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              description: HttpOnly 刷新令牌 Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/register:
    post:
      operationId: register
      summary: 注册学生账号
      description: 校验验证码后创建学生账号并直接返回登录会话；学号或手机号已存在时返回 409。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: 注册成功
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              description: HttpOnly 刷新令牌 Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: 轮换刷新令牌并获取新的访问令牌
      tags: [auth]
      responses:
        "200":
          description: 会话已刷新
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              description: 轮换后的 HttpOnly 刷新令牌 Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 注销当前刷新会话
      tags: [auth]
      responses:
        "200":
          description: 已注销
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              description: 清除刷新令牌 Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      summary: 获取当前用户资料
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户资料
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseUserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: updateCurrentUser
      summary: 修改当前用户资料
      tags: [users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdateRequest"
      responses:
        "200":
          description: 修改后的用户资料
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseUserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/categories:
    get:
      operationId: listCategories
      summary: 获取启用的物品分类
      tags: [catalog]
      responses:
        "200":
          description: 分类列表
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCategoryList"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/posts:
    get:
      operationId: listPosts
      summary: 按条件查询公开帖子
      description: 只返回审核通过、未删除且未到期的帖子，使用创建时间和 ID 组成的游标分页。
      tags: [posts]
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/PostType"
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: keyword
          in: query
          description: 使用 MySQL ngram 全文索引检索标题与描述
          schema:
            type: string
            maxLength: 64
        - name: cursor
          in: query
          schema:
            type: string
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: 帖子游标分页
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePostPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/posts/{publicId}:
    get:
      operationId: getPost
      summary: 获取公开帖子详情
      tags: [posts]
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 帖子详情
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePostDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/health:
    get:
      operationId: getHealth
      summary: 服务健康检查
      tags: [system]
      responses:
        "200":
          description: 服务正常
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseHealth"
        "500":
          description: 服务内部错误
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    RequestId:
      description: 请求追踪编号；调用方可传 8–64 位安全字符，否则服务端生成
      schema:
        type: string
  responses:
    Unauthorized:
      description: 未登录或访问令牌失效
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
    TooManyRequests:
      description: 请求过于频繁
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
    BadRequest:
      description: 请求参数不合法
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
    Conflict:
      description: 学号或手机号已被使用
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
    NotFound:
      description: 资源不存在或不可见
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
    InternalError:
      description: 服务内部错误
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
  schemas:
    SendCodeRequest:
      type: object
      required: [studentNo, phone]
      properties:
        studentNo:
          type: string
          minLength: 4
          maxLength: 24
          pattern: "^[A-Za-z0-9]+$"
          examples: ["20260001"]
        phone:
          type: string
          pattern: "^1[3-9][0-9]{9}$"
          examples: ["13800000001"]

    SendCodeData:
      type: object
      required: [expiresInSeconds, retryAfterSeconds]
      properties:
        expiresInSeconds:
          type: integer
          examples: [300]
        retryAfterSeconds:
          type: integer
          examples: [60]
        debugCode:
          type: [string, "null"]
          description: 仅本地开发环境返回固定验证码
          examples: ["123456"]

    LoginRequest:
      type: object
      required: [studentNo, phone, code]
      properties:
        studentNo:
          type: string
          minLength: 4
          maxLength: 24
        phone:
          type: string
          pattern: "^1[3-9][0-9]{9}$"
        code:
          type: string
          pattern: "^[0-9]{6}$"

    RegisterRequest:
      type: object
      required: [studentNo, phone, code]
      properties:
        studentNo:
          type: string
          minLength: 4
          maxLength: 24
          pattern: "^[A-Za-z0-9]+$"
          examples: ["20269999"]
        phone:
          type: string
          pattern: "^1[3-9][0-9]{9}$"
          examples: ["13900000009"]
        code:
          type: string
          pattern: "^[0-9]{6}$"
          examples: ["123456"]

    UserProfile:
      type: object
      required:
        [publicId, studentNo, realName, phoneMasked, dept, dorm, wechat, role, status, profileComplete, phoneVerified]
      properties:
        publicId:
          type: string
          examples: ["usr_demo_0001"]
        studentNo:
          type: string
          examples: ["20260001"]
        realName:
          type: [string, "null"]
        phoneMasked:
          type: string
          examples: ["138****0001"]
        dept:
          type: [string, "null"]
        dorm:
          type: [string, "null"]
        wechat:
          type: [string, "null"]
        role:
          type: string
          enum: [STUDENT, SERVICE_ADMIN, ADMIN]
        status:
          type: string
          enum: [ACTIVE, BANNED, DELETED]
        profileComplete:
          type: boolean
        phoneVerified:
          type: boolean

    AuthSession:
      type: object
      required: [accessToken, tokenType, expiresIn, user, needsProfileCompletion]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
          examples: [Bearer]
        expiresIn:
          type: integer
          examples: [7200]
        user:
          $ref: "#/components/schemas/UserProfile"
        needsProfileCompletion:
          type: boolean

    UserProfileUpdateRequest:
      type: object
      required: [realName, dept]
      properties:
        realName:
          type: string
          minLength: 1
          maxLength: 64
        dept:
          type: string
          minLength: 1
          maxLength: 64
        dorm:
          type: [string, "null"]
          maxLength: 64
        wechat:
          type: [string, "null"]
          maxLength: 64

    PostType:
      type: string
      enum: [LOST, FOUND]

    PostStatus:
      type: string
      enum: [DRAFT, ACTIVE, CLAIMING, CLAIMED, HANDOVER_FAILED, RETURNED, EXPIRED, CLOSED]

    AuditStatus:
      type: string
      enum: [NOT_SUBMITTED, PENDING, APPROVED, REJECTED, BLOCKED]

    Category:
      type: object
      required: [id, name, slug, sort]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        icon:
          type: [string, "null"]
        sort:
          type: integer

    CategoryListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    PostSummary:
      type: object
      required:
        [publicId, type, title, description, categoryId, categoryName, eventTime, status, auditStatus, matchCount, publisherName]
      properties:
        publicId:
          type: string
          examples: [LF-2026-1031-01]
        type:
          $ref: "#/components/schemas/PostType"
        title:
          type: string
        description:
          type: string
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        locationName:
          type: [string, "null"]
        eventTime:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/PostStatus"
        auditStatus:
          $ref: "#/components/schemas/AuditStatus"
        matchCount:
          type: integer
        publisherName:
          type: string

    PostPageData:
      type: object
      required: [list, hasMore]
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/PostSummary"
        nextCursor:
          type: [string, "null"]
        hasMore:
          type: boolean

    PostDetail:
      allOf:
        - $ref: "#/components/schemas/PostSummary"
        - type: object
          properties:
            brand:
              type: [string, "null"]
            color:
              type: [string, "null"]
            locationDetail:
              type: [string, "null"]
            contactMode:
              type: string
              enum: [PUBLIC, AFTER_CLAIM, IN_APP_ONLY]
            expireAt:
              type: [string, "null"]
              format: date-time

    ApiResponseCategoryList:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [0]
        message:
          type: string
          examples: [ok]
        data:
          $ref: "#/components/schemas/CategoryListData"
        traceId:
          type: string

    ApiResponsePostPage:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [0]
        message:
          type: string
          examples: [ok]
        data:
          $ref: "#/components/schemas/PostPageData"
        traceId:
          type: string

    ApiResponsePostDetail:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [0]
        message:
          type: string
          examples: [ok]
        data:
          $ref: "#/components/schemas/PostDetail"
        traceId:
          type: string

    ApiResponseSendCode:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [0]
        message:
          type: string
          examples: [ok]
        data:
          $ref: "#/components/schemas/SendCodeData"
        traceId:
          type: string

    ApiResponseAuthSession:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [0]
        message:
          type: string
          examples: [ok]
        data:
          $ref: "#/components/schemas/AuthSession"
        traceId:
          type: string

    ApiResponseUserProfile:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [0]
        message:
          type: string
          examples: [ok]
        data:
          $ref: "#/components/schemas/UserProfile"
        traceId:
          type: string

    ApiResponseVoid:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [0]
        message:
          type: string
          examples: [ok]
        data:
          type: "null"
        traceId:
          type: string

    HealthData:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          examples: [UP]
        service:
          type: string
          examples: [campus-lost-found-backend]
        version:
          type: string
          examples: [0.1.0]
        timestamp:
          type: string
          format: date-time

    ApiResponseHealth:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [0]
        message:
          type: string
          examples: [ok]
        data:
          $ref: "#/components/schemas/HealthData"
        traceId:
          type: string
          examples: [8f4c2a51cbb84b4f9e2f6b7e09cb4d8a]

    ApiResponseError:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [50000]
        message:
          type: string
        data:
          description: 错误响应没有数据体
        traceId:
          type: string
          examples: [8f4c2a51cbb84b4f9e2f6b7e09cb4d8a]

