openapi: 3.1.0
info:
  title: Campus Lost & Found API
  version: 0.3.0
  description: |
    健康检查、分类与地点、公开帖子列表与详情、本地演示验证码注册/登录、JWT 与个人资料、管理员接口，
    以及图片上传（file）、认领闭环（claim）与站内通知（notification）。
    所有业务响应统一返回 code、message、data、traceId，并通过 X-Request-Id 传递请求追踪编号。
    后续接口继续按“先契约、后实现、再联调”的顺序追加。
servers:
  - url: http://localhost:8081
    description: 本地开发
security: []

paths:
  /api/v1/auth/sms-code:
    post:
      operationId: sendLoginCode
      summary: 发送登录验证码
      description: 本地开发环境固定返回 123456；验证码 5 分钟有效，同一账号 60 秒内不可重复发送。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendCodeRequest"
      responses:
        "200":
          description: 验证码已生成
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSendCode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      operationId: login
      summary: 验证码登录
      description: 仅允许已注册账号登录；刷新令牌写入 HttpOnly Cookie，访问令牌在响应中返回。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              description: HttpOnly 刷新令牌 Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/register:
    post:
      operationId: register
      summary: 注册学生账号
      description: 校验验证码后创建学生账号并直接返回登录会话；学号或手机号已存在时返回 409。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: 注册成功
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              description: HttpOnly 刷新令牌 Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: 轮换刷新令牌并获取新的访问令牌
      tags: [auth]
      responses:
        "200":
          description: 会话已刷新
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              description: 轮换后的 HttpOnly 刷新令牌 Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 注销当前刷新会话
      tags: [auth]
      responses:
        "200":
          description: 已注销
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              description: 清除刷新令牌 Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      summary: 获取当前用户资料
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户资料
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseUserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: updateCurrentUser
      summary: 修改当前用户资料
      tags: [users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdateRequest"
      responses:
        "200":
          description: 修改后的用户资料
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseUserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/categories:
    get:
      operationId: listCategories
      summary: 获取启用的物品分类
      tags: [catalog]
      responses:
        "200":
          description: 分类列表
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCategoryList"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/posts:
    get:
      operationId: listPosts
      summary: 按条件查询公开帖子
      description: 只返回审核通过、未删除且未到期的帖子，使用创建时间和 ID 组成的游标分页。
      tags: [posts]
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/PostType"
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: keyword
          in: query
          description: 使用 MySQL ngram 全文索引检索标题与描述
          schema:
            type: string
            maxLength: 64
        - name: cursor
          in: query
          schema:
            type: string
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: 帖子游标分页
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePostPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createPost
      summary: 发布失物或招领
      description: 需要登录。创建后立即出现在公开列表，默认 30 天有效。
      tags: [posts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCreateRequest"
      responses:
        "200":
          description: 创建成功，返回帖子详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePostDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/posts/mine:
    get:
      operationId: listMyPosts
      summary: 查询自己发布的帖子
      description: 需要登录，返回最近 50 条，包含尚未公开的状态。
      tags: [posts]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 自己的帖子列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePostSummaryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/posts/{publicId}:
    get:
      operationId: getPost
      summary: 获取公开帖子详情
      tags: [posts]
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 帖子详情
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePostDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/posts/{publicId}/matches:
    get:
      operationId: listPostMatches
      summary: 查询候选匹配记录
      description: 返回相反类型（寻物对招领）、仍在 ACTIVE/CLAIMING 状态的候选，按 score 降序最多 5 条。
      tags: [posts]
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 候选匹配列表
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePostMatchList"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/locations:
    get:
      operationId: listLocations
      summary: 查询可用校园地点
      tags: [catalog]
      responses:
        "200":
          description: 地点列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseLocationList"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/summary:
    get:
      operationId: getAdminSummary
      summary: 管理后台统计
      description: 仅 ADMIN 角色可访问。
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 统计数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAdminSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/users:
    get:
      operationId: listAdminUsers
      summary: 分页查询账号
      description: 仅 ADMIN 角色可访问，手机号按 3-4 位掩码返回。
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          description: 学号、姓名或手机号模糊匹配
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, BANNED]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 5
            maximum: 50
            default: 10
      responses:
        "200":
          description: 账号分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAdminUserPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/users/{publicId}/status:
    patch:
      operationId: updateUserStatus
      summary: 封禁或解封账号
      description: 仅 ADMIN 角色可访问；不能修改自己或其它管理员账号，封禁会同时吊销该账号的刷新令牌。
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, BANNED]
                reason:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: 更新后的账号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAdminUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/health:
    get:
      operationId: getHealth
      summary: 服务健康检查
      tags: [system]
      responses:
        "200":
          description: 服务正常
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseHealth"
        "500":
          description: 服务内部错误
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"

  /api/v1/files:
    post:
      operationId: uploadFile
      summary: 上传图片
      description: |
        以 multipart/form-data 上传单张图片，服务端按文件头识别 JPEG/PNG/GIF/WebP，单文件不超过 5 MB。
        返回的 id 用于发帖时的 imageIds 与认领时的 evidenceFileId；url 可直接用于 img 标签。
      tags: [file]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFileView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: 文件超过大小限制（code=41301）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/posts/{publicId}/claims:
    post:
      operationId: createClaim
      summary: 发起认领
      description: 不能认领自己发布的帖子；帖子须为 ACTIVE/CLAIMING 且当前没有进行中的认领，否则返回 409。
      tags: [claim]
      security:
        - bearerAuth: []
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimCreateRequest"
      responses:
        "200":
          description: 已提交认领
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseClaimView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/claims/mine:
    get:
      operationId: listMyClaims
      summary: 我发起的认领
      tags: [claim]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 认领列表，按创建时间倒序，最多返回 100 条
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseClaimList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/claims/received:
    get:
      operationId: listReceivedClaims
      summary: 别人对我帖子的认领
      tags: [claim]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 认领列表，按创建时间倒序，最多返回 100 条
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseClaimList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/claims/{publicId}:
    get:
      operationId: getClaim
      summary: 认领详情
      description: 仅申请人与帖子发布者可查看。
      tags: [claim]
      security:
        - bearerAuth: []
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 认领详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseClaimView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/claims/{publicId}/confirm:
    post:
      operationId: confirmClaim
      summary: 通过认领（发布者）
      description: 仅 PENDING 状态可确认；确认后帖子进入 CLAIMING。
      tags: [claim]
      security:
        - bearerAuth: []
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimMessageRequest"
      responses:
        "200":
          description: 更新后的认领
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseClaimView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/claims/{publicId}/reject:
    post:
      operationId: rejectClaim
      summary: 拒绝认领（发布者）
      description: 仅 PENDING 状态可拒绝；拒绝后申请人可补充说明重新发起。
      tags: [claim]
      security:
        - bearerAuth: []
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimMessageRequest"
      responses:
        "200":
          description: 更新后的认领
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseClaimView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/claims/{publicId}/reopen:
    post:
      operationId: reopenClaim
      summary: 补充说明重新申请（申请人）
      description: 仅 REJECTED 状态可重新打开，回到 PENDING 等待发布者处理。
      tags: [claim]
      security:
        - bearerAuth: []
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimMessageRequest"
      responses:
        "200":
          description: 更新后的认领
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseClaimView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/claims/{publicId}/cancel:
    post:
      operationId: cancelClaim
      summary: 撤回认领（申请人）
      description: PENDING/CONFIRMED 可撤回；若帖子因该认领进入 CLAIMING 且无其他确认中的认领，则回到 ACTIVE。
      tags: [claim]
      security:
        - bearerAuth: []
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 更新后的认领
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseClaimView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/claims/{publicId}/complete:
    post:
      operationId: completeClaim
      summary: 确认归还完成（发布者）
      description: 仅 CONFIRMED 状态可完成；完成后帖子变为 CLAIMED 并记录归还时间。
      tags: [claim]
      security:
        - bearerAuth: []
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimMessageRequest"
      responses:
        "200":
          description: 更新后的认领
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseClaimView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: 我的通知
      description: 按创建时间倒序返回最近 50 条，包含已读与未读。
      tags: [notification]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 通知列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseNotificationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/notifications/unread-count:
    get:
      operationId: getUnreadCount
      summary: 未读通知数量
      tags: [notification]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 未读数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseUnreadCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      summary: 标记单条已读
      tags: [notification]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已标记
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: 全部标记已读
      tags: [notification]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 已全部标记
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    RequestId:
      description: 请求追踪编号；调用方可传 8–64 位安全字符，否则服务端生成
      schema:
        type: string
  responses:
    Unauthorized:
      description: 未登录或访问令牌失效
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
    Forbidden:
      description: 已登录但无权访问该资源（code=40300）
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
    TooManyRequests:
      description: 请求过于频繁
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
    BadRequest:
      description: 请求参数不合法
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
    Conflict:
      description: 学号或手机号已被使用
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
    NotFound:
      description: 资源不存在或不可见
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
    InternalError:
      description: 服务内部错误
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
  schemas:
    PostImage:
      type: object
      required: [url, primary]
      properties:
        url:
          type: string
          description: 可直接用于 img 的地址；本地存储为 /files/{key}
          examples: ["/files/post/20261111/abc123.jpg"]
        width:
          type: [integer, "null"]
          description: 像素宽；上传时解析并随帖子图片落库，解析失败或历史数据为 null
        height:
          type: [integer, "null"]
          description: 像素高；同上
        primary:
          type: boolean
          description: 是否为封面图

    FileView:
      type: object
      required: [id, url, mime, size]
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
        mime:
          type: string
          enum: [image/jpeg, image/png, image/gif, image/webp]
        size:
          type: integer
          format: int64
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]

    ClaimCreateRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 500
          description: 归属说明，不能为空；建议写清物品特征、丢失时间等可核验细节（前端引导至少 5 个字）
        contact:
          type: [string, "null"]
          maxLength: 120
        evidenceFileId:
          type: [integer, "null"]
          format: int64
          description: 佐证图片，需为本账号上传的图片

    ClaimMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 500

    ClaimView:
      type: object
      required:
        [publicId, postPublicId, postTitle, postStatus, applicantPublicId, applicantName, ownerPublicId, ownerName, status, message, createdAt]
      properties:
        publicId:
          type: string
          examples: ["CL-20261111-A1B2"]
        postPublicId:
          type: string
        postTitle:
          type: string
        postStatus:
          $ref: "#/components/schemas/PostStatus"
        applicantPublicId:
          type: string
        applicantName:
          type: string
        ownerPublicId:
          type: string
        ownerName:
          type: string
        status:
          type: string
          enum: [PENDING, CONFIRMED, REJECTED, HANDOVER_FAILED, COMPLETED, CANCELED, EXPIRED]
        message:
          type: string
        contact:
          type: [string, "null"]
        evidenceFileId:
          type: [integer, "null"]
          format: int64
        confirmedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        canceledAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    NotificationView:
      type: object
      required: [id, category, title, content, read, createdAt]
      properties:
        id:
          type: integer
          format: int64
        category:
          type: string
          enum: [MATCH, CLAIM, AUDIT, SYSTEM]
        title:
          type: string
        content:
          type: string
        refType:
          type: [string, "null"]
          enum: [POST, CLAIM, MESSAGE, null]
        refId:
          type: [integer, "null"]
          format: int64
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UnreadCountData:
      type: object
      required: [count]
      properties:
        count:
          type: integer

    ApiResponseFileView:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: "#/components/schemas/FileView"
        traceId:
          type: string

    ApiResponseClaimView:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: "#/components/schemas/ClaimView"
        traceId:
          type: string

    ApiResponseClaimList:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/ClaimView"
        traceId:
          type: string

    ApiResponseNotificationList:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/NotificationView"
        traceId:
          type: string

    ApiResponseUnreadCount:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: "#/components/schemas/UnreadCountData"
        traceId:
          type: string

    SendCodeRequest:
      type: object
      required: [studentNo, phone]
      properties:
        studentNo:
          type: string
          minLength: 4
          maxLength: 24
          pattern: "^[A-Za-z0-9]+$"
          examples: ["20260001"]
        phone:
          type: string
          pattern: "^1[3-9][0-9]{9}$"
          examples: ["13800000001"]

    SendCodeData:
      type: object
      required: [expiresInSeconds, retryAfterSeconds]
      properties:
        expiresInSeconds:
          type: integer
          examples: [300]
        retryAfterSeconds:
          type: integer
          examples: [60]
        debugCode:
          type: [string, "null"]
          description: 仅本地开发环境返回固定验证码
          examples: ["123456"]

    LoginRequest:
      type: object
      required: [studentNo, phone, code]
      properties:
        studentNo:
          type: string
          minLength: 4
          maxLength: 24
        phone:
          type: string
          pattern: "^1[3-9][0-9]{9}$"
        code:
          type: string
          pattern: "^[0-9]{6}$"

    RegisterRequest:
      type: object
      required: [studentNo, phone, code]
      properties:
        studentNo:
          type: string
          minLength: 4
          maxLength: 24
          pattern: "^[A-Za-z0-9]+$"
          examples: ["20269999"]
        phone:
          type: string
          pattern: "^1[3-9][0-9]{9}$"
          examples: ["13900000009"]
        code:
          type: string
          pattern: "^[0-9]{6}$"
          examples: ["123456"]

    UserProfile:
      type: object
      required:
        [publicId, studentNo, realName, phoneMasked, dept, dorm, wechat, role, status, profileComplete, phoneVerified]
      properties:
        publicId:
          type: string
          examples: ["usr_demo_0001"]
        studentNo:
          type: string
          examples: ["20260001"]
        realName:
          type: [string, "null"]
        phoneMasked:
          type: string
          examples: ["138****0001"]
        dept:
          type: [string, "null"]
        dorm:
          type: [string, "null"]
        wechat:
          type: [string, "null"]
        role:
          type: string
          enum: [STUDENT, SERVICE_ADMIN, ADMIN]
        status:
          type: string
          enum: [ACTIVE, BANNED, DELETED]
        profileComplete:
          type: boolean
        phoneVerified:
          type: boolean

    AuthSession:
      type: object
      required: [accessToken, tokenType, expiresIn, user, needsProfileCompletion]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
          examples: [Bearer]
        expiresIn:
          type: integer
          examples: [7200]
        user:
          $ref: "#/components/schemas/UserProfile"
        needsProfileCompletion:
          type: boolean

    UserProfileUpdateRequest:
      type: object
      required: [realName, dept]
      properties:
        realName:
          type: string
          minLength: 1
          maxLength: 64
        dept:
          type: string
          minLength: 1
          maxLength: 64
        dorm:
          type: [string, "null"]
          maxLength: 64
        wechat:
          type: [string, "null"]
          maxLength: 64

    PostType:
      type: string
      enum: [LOST, FOUND]

    PostStatus:
      type: string
      enum: [DRAFT, ACTIVE, CLAIMING, CLAIMED, HANDOVER_FAILED, RETURNED, EXPIRED, CLOSED]

    AuditStatus:
      type: string
      enum: [NOT_SUBMITTED, PENDING, APPROVED, REJECTED, BLOCKED]

    Category:
      type: object
      required: [id, name, slug, sort]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        icon:
          type: [string, "null"]
        sort:
          type: integer

    CategoryListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    PostSummary:
      type: object
      required:
        [publicId, type, title, description, categoryId, categoryName, eventTime, status, auditStatus, matchCount, publisherName]
      properties:
        publicId:
          type: string
          examples: [LF-2026-1031-01]
        type:
          $ref: "#/components/schemas/PostType"
        title:
          type: string
        description:
          type: string
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        locationName:
          type: [string, "null"]
        eventTime:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/PostStatus"
        auditStatus:
          $ref: "#/components/schemas/AuditStatus"
        matchCount:
          type: integer
        publisherName:
          type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/PostImage"

    PostPageData:
      type: object
      required: [list, hasMore]
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/PostSummary"
        nextCursor:
          type: [string, "null"]
        hasMore:
          type: boolean

    PostDetail:
      allOf:
        - $ref: "#/components/schemas/PostSummary"
        - type: object
          properties:
            brand:
              type: [string, "null"]
            color:
              type: [string, "null"]
            locationDetail:
              type: [string, "null"]
            contactMode:
              type: string
              enum: [PUBLIC, AFTER_CLAIM, IN_APP_ONLY]
            expireAt:
              type: [string, "null"]
              format: date-time
            images:
              type: array
              items:
                $ref: "#/components/schemas/PostImage"

    ApiResponsePostMatchList:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [0]
        message:
          type: string
          examples: [ok]
        data:
          type: array
          items:
            $ref: "#/components/schemas/PostMatch"
        traceId:
          type: string

    PostMatch:
      type: object
      required: [publicId, title, type, score, reasons]
      properties:
        publicId:
          type: string
          examples: [LF-20261105-XS5X]
        title:
          type: string
        type:
          type: string
          enum: [LOST, FOUND]
        categoryName:
          type: [string, "null"]
        locationName:
          type: [string, "null"]
        status:
          type: string
        score:
          type: integer
          minimum: 0
        reasons:
          type: array
          items:
            type: string

    ApiResponseCategoryList:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [0]
        message:
          type: string
          examples: [ok]
        data:
          $ref: "#/components/schemas/CategoryListData"
        traceId:
          type: string

    ApiResponsePostPage:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [0]
        message:
          type: string
          examples: [ok]
        data:
          $ref: "#/components/schemas/PostPageData"
        traceId:
          type: string

    ApiResponsePostDetail:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [0]
        message:
          type: string
          examples: [ok]
        data:
          $ref: "#/components/schemas/PostDetail"
        traceId:
          type: string

    ApiResponseSendCode:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [0]
        message:
          type: string
          examples: [ok]
        data:
          $ref: "#/components/schemas/SendCodeData"
        traceId:
          type: string

    ApiResponseAuthSession:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [0]
        message:
          type: string
          examples: [ok]
        data:
          $ref: "#/components/schemas/AuthSession"
        traceId:
          type: string

    ApiResponseUserProfile:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [0]
        message:
          type: string
          examples: [ok]
        data:
          $ref: "#/components/schemas/UserProfile"
        traceId:
          type: string

    ApiResponseVoid:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [0]
        message:
          type: string
          examples: [ok]
        data:
          type: "null"
        traceId:
          type: string

    HealthData:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          examples: [UP]
        service:
          type: string
          examples: [campus-lost-found-backend]
        version:
          type: string
          examples: [0.1.0]
        timestamp:
          type: string
          format: date-time

    ApiResponseHealth:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [0]
        message:
          type: string
          examples: [ok]
        data:
          $ref: "#/components/schemas/HealthData"
        traceId:
          type: string
          examples: [8f4c2a51cbb84b4f9e2f6b7e09cb4d8a]

    ErrorCode:
      type: integer
      description: |
        业务错误码。0 表示成功，非 0 与 HTTP 状态码一一对应：

        | code | HTTP | 含义 |
        | --- | --- | --- |
        | 0 | 200 | 成功 |
        | 40001 | 400 | 请求参数或请求体不合法（含图片类型/大小校验失败） |
        | 40100 | 401 | 未登录、令牌缺失或已失效 |
        | 40300 | 403 | 已登录但无权访问该资源 |
        | 40400 | 404 | 资源不存在或对当前用户不可见 |
        | 40900 | 409 | 状态冲突（重复注册、帖子已被认领、认领状态不允许该操作等） |
        | 41301 | 413 | 上传文件超过 5 MB 上限 |
        | 42900 | 429 | 请求过于频繁（验证码等接口的限流） |
        | 50000 | 500 | 服务器内部错误 |
      examples: [40001, 40100, 40300, 40400, 40900, 41301, 42900, 50000]

    ApiResponseError:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          description: 错误响应没有数据体
        traceId:
          type: string
          examples: [8f4c2a51cbb84b4f9e2f6b7e09cb4d8a]

    PostCreateRequest:
      type: object
      required: [type, title, description, categoryId, eventTime]
      properties:
        type:
          $ref: "#/components/schemas/PostType"
        title:
          type: string
          minLength: 2
          maxLength: 60
        description:
          type: string
          minLength: 5
          maxLength: 1000
        categoryId:
          type: integer
          format: int64
        locationId:
          type: integer
          format: int64
          nullable: true
        detail:
          type: string
          maxLength: 200
          nullable: true
        eventTime:
          type: string
          format: date-time
          description: 不能晚于当前时间，也不能早于一年前
        brand:
          type: string
          maxLength: 64
          nullable: true
        color:
          type: string
          maxLength: 16
          nullable: true
        contactMode:
          type: string
          enum: [PUBLIC, AFTER_CLAIM, IN_APP_ONLY]
          default: IN_APP_ONLY
        imageIds:
          type: array
          maxItems: 6
          description: 先调 POST /api/v1/files 上传，再按顺序传入文件 id
          items:
            type: integer
            format: int64

    LocationView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        alias:
          type: string
          nullable: true
        building:
          type: string
          nullable: true
        type:
          type: string
        servicePoint:
          type: boolean

    AdminSummaryData:
      type: object
      properties:
        totalUsers:
          type: integer
          format: int64
        activeUsers:
          type: integer
          format: int64
        bannedUsers:
          type: integer
          format: int64
        adminUsers:
          type: integer
          format: int64
        totalPosts:
          type: integer
          format: int64
        activePosts:
          type: integer
          format: int64

    AdminUserView:
      type: object
      properties:
        publicId:
          type: string
        studentNo:
          type: string
          nullable: true
        realName:
          type: string
          nullable: true
        phoneMasked:
          type: string
          nullable: true
        dept:
          type: string
          nullable: true
        role:
          type: string
          enum: [STUDENT, SERVICE_ADMIN, ADMIN]
        status:
          type: string
          enum: [ACTIVE, BANNED, DELETED]
        postCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true

    AdminUserPage:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserView"
        total:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer

    ApiResponsePostSummaryList:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          examples: [0]
        message:
          type: string
          examples: [ok]
        data:
          type: array
          items:
            $ref: "#/components/schemas/PostSummary"
        traceId:
          type: string

    ApiResponseLocationList:
      type: object
      required: [code, message, data, traceId]
      properties:
