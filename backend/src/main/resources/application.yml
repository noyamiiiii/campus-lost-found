server:
  # 8080 常被其他软件（如 Steam）占用，默认改用 8081；需要时用 SERVER_PORT 覆盖。
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: campus-lost-found-backend
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:32MB}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:3307}/${MYSQL_DATABASE:lostfound}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:lostfound}
    password: ${MYSQL_PASSWORD:clf_dev_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      # 健康检查等基础接口可在数据库暂未启动时完成启动；业务查询仍会明确报错。
      initialization-fail-timeout: -1
  flyway:
    enabled: false
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: always
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

info:
  app:
    name: ${spring.application.name}
    version: 0.2.0

app:
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:clf-local-development-jwt-secret-change-before-deploy}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:2h}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:7d}
    refresh-cookie-name: ${AUTH_REFRESH_COOKIE:clf_refresh}
    refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
    fixed-sms-code: ${AUTH_FIXED_SMS_CODE:123456}
    expose-sms-code: ${AUTH_EXPOSE_SMS_CODE:false}
  storage:
    # local：写本地磁盘，后端直接以 /files/** 提供访问，开发机无需 Docker
    # s3：写 MinIO / 兼容 S3 的对象存储，切换后 publicBaseUrl 需指向可访问地址
    provider: ${STORAGE_PROVIDER:local}
    local-root: ${STORAGE_LOCAL_ROOT:./data/files}
    local-public-path: ${STORAGE_LOCAL_PUBLIC_PATH:/files}
    max-file-bytes: ${STORAGE_MAX_FILE_BYTES:5242880}
    max-images-per-post: ${STORAGE_MAX_IMAGES_PER_POST:6}
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:http://127.0.0.1:9000}
      region: ${STORAGE_S3_REGION:us-east-1}
      access-key: ${STORAGE_S3_ACCESS_KEY:clfadmin}
      secret-key: ${STORAGE_S3_SECRET_KEY:clf_dev_minio}
      bucket: ${STORAGE_S3_BUCKET:lostfound}
      public-base-url: ${STORAGE_S3_PUBLIC_BASE_URL:}

logging:
  level:
    root: INFO
    edu.campus.lostfound: INFO

